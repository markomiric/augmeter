name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # OS-independent gates run once on Linux only.
    # (Prettier's format:check would false-fail on Windows CRLF checkouts.)
    - name: Security audit (production dependencies)
      if: runner.os == 'Linux'
      run: npm audit --omit=dev --audit-level=high

    - name: Check formatting
      if: runner.os == 'Linux'
      run: npm run format:check

    - name: Run linting
      if: runner.os == 'Linux'
      run: npm run lint

    # Compile + unit tests run on all three OSes to catch per-OS path
    # regressions (Copilot state.vscdb resolution, Auggie .cmd handling).
    - name: Compile TypeScript
      run: npm run compile

    - name: Run unit tests with coverage gate
      run: npm run test:cov
      # Build will fail if coverage below thresholds

    - name: Upload unit coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: matrix.os == 'ubuntu-latest'
      with:
        name: unit-coverage-${{ matrix.node-version }}
        path: coverage
        retention-days: 7

  integration:
    name: VS Code ${{ matrix.vscode-version }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ["1.104.1", "stable"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run integration tests (VS Code Extension Host)
      env:
        VSCODE_VERSION: ${{ matrix.vscode-version }}
      run: xvfb-run -a npm run test:integration

  package:
    name: Package smoke (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The current Marketplace packager uses Node 22-only transitive tooling.
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build and exercise packaged VSIX
      if: runner.os != 'Linux'
      run: npm run test:packaged

    - name: Build and exercise packaged VSIX (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a npm run test:packaged

    - name: Generate SBOM
      if: runner.os == 'Linux'
      run: npm run sbom

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v4
      if: runner.os == 'Linux'
      with:
        name: sbom-22.x
        path: sbom.json
        retention-days: 90

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      if: runner.os == 'Linux'
      with:
        name: extension-package
        path: '*.vsix'
        retention-days: 7
