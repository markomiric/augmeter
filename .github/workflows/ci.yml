name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # OS-independent gates run once on Linux only.
    # (Prettier's format:check would false-fail on Windows CRLF checkouts.)
    - name: Security audit (production dependencies)
      if: runner.os == 'Linux'
      run: npm audit --omit=dev --audit-level=high

    - name: Check formatting
      if: runner.os == 'Linux'
      run: npm run format:check

    - name: Run linting
      if: runner.os == 'Linux'
      run: npm run lint

    # Compile + unit tests run on all three OSes to catch per-OS path
    # regressions (Copilot state.vscdb resolution, Auggie .cmd handling).
    - name: Compile TypeScript
      run: npm run compile

    - name: Run unit tests with coverage gate
      run: npm run test:cov
      # Build will fail if coverage below thresholds

    - name: Upload unit coverage report
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: unit-coverage-${{ matrix.node-version }}
        path: coverage
        retention-days: 7

    # Integration tests need the VS Code Extension Host under a display server;
    # xvfb-run is Linux-only, so gate to Linux per MS guidance.
    - name: Run integration tests (VS Code Extension Host)
      if: runner.os == 'Linux'
      run: xvfb-run -a npm run test:integration

    # Package / SBOM / artifact uploads run once, on ubuntu only.
    - name: Package extension
      if: matrix.os == 'ubuntu-latest'
      run: npm run package

    - name: Generate SBOM
      if: matrix.os == 'ubuntu-latest'
      run: npm run sbom

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: sbom-${{ matrix.node-version }}
        path: sbom.json
        retention-days: 90

    - name: Upload package artifact
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: extension-package
        path: '*.vsix'
        retention-days: 7
